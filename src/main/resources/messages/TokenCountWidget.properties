### Widget general
widget.description=Token counter for code and text content
widget.display_name=Token Counter

### Tooltips
tooltip.default=Current file token count
tooltip.no_file=No file selected
tooltip.file_info=<html><body>File: %s<br>Tokens: %d</body></html>

### Status messages
status.calculating=Calculating%s

### Token count formats
count.zero=0 Tokens
count.one=1 Token
count.chars=%d Chars
count.millions=%dM Tokens
count.thousands=%dK Tokens
count.normal=%d Tokens

### Processing tooltip
tooltip.calculating_html=<html><body style='font-family: Arial, sans-serif;'>\
  <div style='padding: 10px; background-color: #f5f5f5; border: 1px solid #ddd; border-radius: 4px;'>\
  <div style='margin-bottom: 5px;'><span style='font-family: monospace; color: #2196F3;'>%s</span> <b>Processing</b></div>\
  <div style='color: #666;'>Calculating token count for selected content</div>\
  <div style='font-size: 90%; color: #888; margin-top: 5px;'>Please wait while processing...</div>\
  </div></body></html>